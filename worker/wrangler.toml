name = "beautiful-table-worker"
main = "src/index.ts"
compatibility_date = "2025-01-28"
compatibility_flags = ["nodejs_compat"]

# Environment variables (use wrangler secret for sensitive values)
# wrangler secret put DATABASE_URL
# wrangler secret put BETTER_AUTH_SECRET
# wrangler secret put GOOGLE_CLIENT_ID
# wrangler secret put GOOGLE_CLIENT_SECRET
# wrangler secret put STRIPE_SECRET_KEY

[vars]
ENVIRONMENT = "production"
APP_URL = "https://beautiful-table-worker.aries10011.workers.dev"

# Staging environment configuration
[env.staging]
name = "beautiful-table-worker-staging"

[env.staging.vars]
ENVIRONMENT = "staging"
APP_URL = "https://beautiful-table-worker-staging.aries10011.workers.dev"

# Vitest integration for testing
[env.test]
name = "beautiful-table-worker-test"
